<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>段取り帳</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Shippori+Mincho+B1:wght@600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
/* Layout: 手帳の見開き。左ページ＝入力とリスト、右ページ＝方眼の時間軸。上に一週間の帯 */
:root{
  --paper:#eef0f4; --sheet:#ffffff; --ink:#1b2130; --muted:#646d82; --line:#d9dde6; --grid:#edf0f5;
  --accent:#2b47a0; --accent-ink:#ffffff; --hi:#e9b52f; --now:#d23f28; --warn:#b4432c; --warn-bg:#fbe8e3; --ok:#2f7d4f;
  --k-class:#3550b5; --k-study:#0f7f73; --k-work:#b7700a; --k-hobby:#9a4a8f; --k-life:#5d7d45; --k-move:#6b7385; --k-rest:#8a90a0; --k-gcal:#1f6fd1;
  --f-display:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic UI","Noto Sans JP",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --ppm:1.4px; --gut:52px;
  color-scheme:light;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root{
  --paper:#11141b; --sheet:#181c25; --ink:#e5e8ef; --muted:#9097a8; --line:#2b3140; --grid:#1f2430;
  --accent:#8ea2ff; --accent-ink:#0e1220; --hi:#f0c24e; --now:#ff6b50; --warn:#ff8a70; --warn-bg:#3a1f1a; --ok:#6fd39a;
  --k-class:#8ea2ff; --k-study:#4fd1bf; --k-work:#f0b04a; --k-hobby:#e08ad4; --k-life:#9ccb7d; --k-move:#a3abbd; --k-rest:#7d8496; --k-gcal:#6aa8ff;
  color-scheme:dark;
}}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{opacity:.45;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}

.app{max-width:1220px;margin:0 auto;padding-block:20px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px 28px;padding-bottom:14px}
.brand{font-size:12px;letter-spacing:.18em;color:var(--muted);margin-bottom:2px}
.datenav{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.datenav h1{margin:0 6px;font-family:var(--f-display);font-weight:700;font-size:clamp(26px,5vw,34px);line-height:1.15;display:flex;align-items:baseline;gap:8px}
.datenav .wd{font-size:.55em;border:1.5px solid currentColor;border-radius:50%;width:1.9em;height:1.9em;display:inline-grid;place-items:center;transform:translateY(-.15em)}
.sun{color:var(--now)} .sat{color:var(--accent)}
.iconbtn{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--sheet);display:grid;place-items:center;font-size:18px;line-height:1;padding:0}
.iconbtn:hover{border-color:var(--accent)}
.pill{border:1px solid var(--line);background:var(--sheet);border-radius:999px;padding:4px 12px;font-size:13px}
.pill:hover{border-color:var(--accent);color:var(--accent)}
.stats{display:flex;flex-wrap:wrap;gap:4px 22px}
.stat{display:flex;flex-direction:column}
.stat .k{font-size:11px;letter-spacing:.12em;color:var(--muted)}
.stat .v{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:17px;font-weight:500}
.stat.bad .v{color:var(--warn)}

/* week strip */
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;padding-block:12px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.wk{background:transparent;border:1px solid transparent;border-radius:10px;padding:6px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:2px}
.wk:hover{border-color:var(--line);background:var(--sheet)}
.wk.sel{background:var(--sheet);border-color:var(--accent)}
.wk .wkd{font-size:11px;color:var(--muted)}
.wk .wdn{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:16px;font-weight:500;line-height:1.2}
.wk.today .wdn{background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:0 7px}
.wk .wbar{width:70%;height:4px;border-radius:2px;background:var(--grid);overflow:hidden}
.wk .wbar i{display:block;height:100%;background:var(--accent)}
.wk .wbar i.over{background:var(--warn)}
.wk .wmin{font-family:var(--f-mono);font-size:10.5px;color:var(--muted)}

.banner{margin-top:14px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:10px 14px;border:1px dashed var(--line);border-radius:10px;background:var(--sheet);font-size:14px;color:var(--muted)}

/* spread */
.spread{display:grid;grid-template-columns:minmax(0,1fr);gap:24px;margin-top:20px}
@media (min-width:940px){
  .spread{grid-template-columns:380px minmax(0,1fr)}
  .left{position:sticky;top:16px;align-self:start;max-height:calc(100vh - 32px);overflow:auto;padding-right:4px}
}
.left,.right{display:flex;flex-direction:column;gap:16px;min-width:0}
.h2{font-size:12px;letter-spacing:.16em;color:var(--muted);margin:0 0 8px;font-weight:500}
.card{background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px}

/* forms */
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field>span{font-size:12px;color:var(--muted)}
input[type=text],input[type=number],input[type=time],select,textarea{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
input[type=text]{font-size:16px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1 1 120px}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:3px 10px;font-family:var(--f-mono);font-size:13px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chips input{width:76px;flex:0 0 auto}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg label{position:relative}
.seg input{position:absolute;opacity:0;inset:0}
.seg span{display:block;padding:6px 14px;font-size:14px;cursor:pointer}
.seg input:checked+span{background:var(--accent);color:var(--accent-ink)}
.seg input:focus-visible+span{outline:2px solid var(--accent);outline-offset:-2px}
.check{display:flex;align-items:center;gap:8px;font-size:14px}
.check input{width:16px;height:16px;accent-color:var(--accent);flex:0 0 auto}
.timepick{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.timepick input[type=time]{width:auto}
.wdpick{display:flex;flex-wrap:wrap;gap:6px}
.wdpick label{position:relative}
.wdpick input{position:absolute;opacity:0;inset:0}
.wdpick span{display:grid;place-items:center;width:34px;height:34px;border:1px solid var(--line);border-radius:50%;font-size:13px;cursor:pointer}
.wdpick input:checked+span{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.wdpick input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.primary{background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:9px 16px;font-weight:700}
.primary:hover{filter:brightness(1.08)}
.ghost{background:transparent;border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:14px}
.ghost:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.small{padding:3px 9px;font-size:12.5px;border-radius:6px}
.danger{background:transparent;border:1px solid var(--warn);color:var(--warn);border-radius:8px;padding:8px 12px;font-size:14px}
.danger.armed{background:var(--warn);color:var(--sheet)}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.err{color:var(--warn);font-size:13px;margin:0}
.hint{font-size:12px;color:var(--muted);margin:0}

/* google panel */
.gpanel .gtop{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.gmark{width:22px;height:22px;flex:0 0 auto}
.gname{font-weight:700;font-size:14px;min-width:0;overflow-wrap:anywhere}
.gstatus{font-size:12.5px;color:var(--muted)}
.gstatus.bad{color:var(--warn)}
.gbtn{display:inline-flex;align-items:center;gap:8px;background:var(--sheet);border:1px solid var(--line);border-radius:999px;padding:7px 16px 7px 10px;font-weight:500;font-size:14px}
.gbtn:hover{border-color:var(--accent)}
.calist{display:flex;flex-direction:column;gap:6px;max-height:220px;overflow:auto}
.calist label{display:flex;align-items:center;gap:8px;font-size:14px;min-width:0}
.calist .cdot{width:10px;height:10px;border-radius:3px;flex:0 0 auto}
.calist .cn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
details.sub summary{cursor:pointer;font-size:13.5px;color:var(--muted)}
details.sub[open] summary{margin-bottom:8px}

/* task list */
.warnbox{border:1px solid var(--warn);background:var(--warn-bg);color:var(--ink);border-radius:10px;padding:10px 12px;font-size:13.5px}
.warnbox b{color:var(--warn)}
.tasks{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;background:var(--sheet);overflow:hidden}
.trow{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 12px;border-top:1px solid var(--line);cursor:pointer}
.trow:first-child{border-top:0}
.trow:hover{background:color-mix(in srgb,var(--kc) 6%,var(--sheet))}
.chk{width:22px;height:22px;border-radius:6px;border:1.5px solid var(--kc);background:transparent;display:grid;place-items:center;padding:0;color:transparent}
.trow.done .chk{background:var(--kc);color:var(--sheet)}
.ttitle{font-weight:500;overflow-wrap:anywhere}
.trow.done .ttitle{text-decoration:line-through;color:var(--muted)}
.tmeta{font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:2px 10px;align-items:center}
.tmeta .t{font-family:var(--f-mono);font-variant-numeric:tabular-nums;color:var(--kc)}
.prio{font-size:11px;border-radius:4px;padding:0 5px;border:1px solid var(--line)}
.prio.p1{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.prio.p3{color:var(--muted)}
.miss{color:var(--warn);font-weight:700}
.dot{width:9px;height:9px;border-radius:50%;background:var(--kc);display:inline-block;flex:0 0 auto}
.empty{padding:16px;color:var(--muted);font-size:14px}
.irow{display:grid;grid-template-columns:12px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 12px;border-top:1px solid var(--line)}
.irow:first-child{border-top:0}
.irow .acts{display:flex;gap:6px}
.rrow{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}
.rrow .rt{flex:1;min-width:0}
.rrow .rm{font-size:12px;color:var(--muted);font-family:var(--f-mono)}

details.settings{border:1px solid var(--line);border-radius:12px;background:var(--sheet)}
details.settings>summary{padding:12px 16px;cursor:pointer;font-size:14px}
.setgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 16px 16px}
.setgrid .full{grid-column:1/-1}

/* categories */
.k-class{--kc:var(--k-class)} .k-study{--kc:var(--k-study)} .k-work{--kc:var(--k-work)} .k-hobby{--kc:var(--k-hobby)} .k-life{--kc:var(--k-life)} .k-move{--kc:var(--k-move)} .k-rest{--kc:var(--k-rest)} .k-gcal{--kc:var(--k-gcal)}

/* now card */
.nowcard{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.nowcard>div{background:var(--sheet);padding:12px 16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.nowcard .lab{font-size:11px;letter-spacing:.16em;color:var(--muted)}
.nowcard .big{font-size:18px;font-weight:700;overflow-wrap:anywhere;line-height:1.35}
.nowcard .sub{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.nowcard .nx .lab{color:color-mix(in srgb,var(--hi) 70%,var(--ink))}
.prog{height:5px;border-radius:3px;background:var(--grid);overflow:hidden;margin-top:2px}
.prog i{display:block;height:100%;background:var(--now)}

/* balance */
.balance{display:flex;flex-direction:column;gap:8px}
.bar{display:flex;height:10px;border-radius:999px;overflow:hidden;background:var(--grid)}
.bar span{background:var(--kc);height:100%}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend b{font-family:var(--f-mono);font-weight:500;color:var(--ink)}

/* all-day strip */
.gstrip{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.gstrip .lab{font-size:12px;color:var(--muted)}
.gchip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--sheet);border-radius:999px;padding:3px 10px;font-size:13px;max-width:100%}
.gchip i{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
.gchip.ign{opacity:.6;text-decoration:line-through}

/* timeline */
.tlhead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px}
.key{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted)}
.key i{display:inline-block;width:18px;height:11px;border-radius:3px;vertical-align:-1px;margin-right:5px}
.key .kf{background:color-mix(in srgb,var(--k-class) 24%,var(--sheet))}
.key .ka{background:color-mix(in srgb,var(--k-class) 8%,var(--sheet));border:1px solid color-mix(in srgb,var(--k-class) 50%,transparent)}
.key .kg{background:color-mix(in srgb,var(--k-gcal) 18%,var(--sheet));border-left:3px solid var(--k-gcal)}
.key .kb{background:repeating-linear-gradient(45deg,var(--line) 0 3px,transparent 3px 6px);border:1px dashed var(--line)}
.tl-wrap{background:var(--sheet);border:1px solid var(--line);border-radius:12px;max-height:min(80vh,940px);overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain}
.timeline{position:relative;margin:14px 0}
.timeline::before{content:"";position:absolute;inset:0 0 0 var(--gut);background:repeating-linear-gradient(to bottom,transparent 0 calc(var(--ppm)*30 - 1px),var(--grid) calc(var(--ppm)*30 - 1px) calc(var(--ppm)*30));pointer-events:none}
.hr{position:absolute;left:0;right:0;height:0;border-top:1px solid var(--line);pointer-events:none}
.hr span{position:absolute;left:8px;top:-9px;font-family:var(--f-mono);font-size:11px;color:var(--muted);background:var(--sheet);padding-right:4px}
.past{position:absolute;left:var(--gut);right:0;top:0;background:color-mix(in srgb,var(--muted) 7%,transparent);pointer-events:none}
.nowline{position:absolute;left:calc(var(--gut) - 6px);right:0;height:0;border-top:2px solid var(--now);z-index:5;pointer-events:none}
.nowline::before{content:"";position:absolute;left:-4px;top:-6px;width:10px;height:10px;border-radius:50%;background:var(--now)}
.nowline span{position:absolute;right:6px;top:-20px;font-family:var(--f-mono);font-size:11px;color:var(--now);background:var(--sheet);padding:0 4px;border-radius:4px}
.gap{position:absolute;left:var(--gut);right:8px;margin-left:4px;border:1px dashed transparent;border-radius:8px;background:transparent;color:var(--muted);font-size:12px;text-align:left;padding:2px 10px;display:flex;align-items:center;gap:8px;z-index:1}
.gap:hover,.gap:focus-visible{border-color:var(--accent);color:var(--accent)}
.gap .plus{opacity:0} .gap:hover .plus,.gap:focus-visible .plus{opacity:1}

.blk{position:absolute;border-radius:8px;padding:4px 8px;overflow:hidden;z-index:2;cursor:grab;touch-action:pan-y;user-select:none;-webkit-user-select:none;
  background:color-mix(in srgb,var(--kc) 8%,var(--sheet));border:1px solid color-mix(in srgb,var(--kc) 48%,transparent);display:flex;flex-direction:column}
.blk.fixed{background:color-mix(in srgb,var(--kc) 22%,var(--sheet));border-color:color-mix(in srgb,var(--kc) 30%,transparent)}
.blk.gcal{cursor:pointer;background:color-mix(in srgb,var(--kc) 16%,var(--sheet));border:0;border-left:3px solid var(--kc);border-radius:4px 8px 8px 4px}
.blk.brk{background:repeating-linear-gradient(45deg,var(--grid) 0 5px,transparent 5px 10px),var(--sheet);border:1px dashed var(--line);color:var(--muted)}
.blk .bt{display:flex;gap:6px;align-items:baseline;min-width:0}
.blk .tm{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:11px;color:var(--kc);white-space:nowrap}
.blk .ti{font-size:13.5px;font-weight:500;line-height:1.35;overflow:hidden;text-overflow:ellipsis}
.blk.compact{flex-direction:row;align-items:center;gap:6px;padding-block:0}
.blk.compact .ti{white-space:nowrap}
.blk .pin{width:11px;height:11px;flex:0 0 auto;color:var(--kc);align-self:center}
.blk .rt{font-size:10px;border:1px solid currentColor;border-radius:3px;padding:0 3px;color:var(--muted);align-self:center;white-space:nowrap}
.blk.done{opacity:.5} .blk.done .ti{text-decoration:line-through}
.blk.next{box-shadow:0 0 0 2px var(--hi)}
.blk.clash{outline:2px solid var(--warn);outline-offset:-1px}
.blk.lift,.blk.dragging{z-index:6;box-shadow:0 8px 24px rgba(0,0,0,.18);cursor:grabbing}
.grip{position:absolute;left:0;right:0;bottom:0;height:9px;cursor:ns-resize;touch-action:none}
.grip::after{content:"";position:absolute;left:50%;bottom:3px;width:22px;height:3px;margin-left:-11px;border-radius:2px;background:var(--kc);opacity:0;transition:opacity .15s}
.blk:hover .grip::after{opacity:.6}
@media (hover:none){.grip::after{opacity:.4}}

/* overlay */
.overlay{position:fixed;inset:0;background:rgba(10,14,24,.45);z-index:50;display:grid;place-items:end center;padding:16px;padding-bottom:max(16px,env(safe-area-inset-bottom,0px))}
@media (min-width:640px){.overlay{place-items:center}}
.sheet{background:var(--sheet);border:1px solid var(--line);border-radius:14px;width:min(520px,100%);max-height:calc(100% - 8px);overflow:auto;padding:18px;display:flex;flex-direction:column;gap:12px}
.sheet h2{margin:0;font-family:var(--f-display);font-size:20px;overflow-wrap:anywhere}
.sheet-actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:4px}
.sheet-actions .sp{flex:1}
.desc{font-size:13.5px;color:var(--muted);white-space:pre-wrap;overflow-wrap:anywhere;max-height:160px;overflow:auto;margin:0}
.ctx{position:fixed;z-index:55;background:var(--sheet);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.18);padding:4px;min-width:150px;display:flex;flex-direction:column}
.ctx .ctit{font-size:11.5px;color:var(--muted);padding:4px 10px 2px;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ctx button{background:transparent;border:0;border-radius:6px;text-align:left;padding:7px 10px;font-size:14px}
.ctx button:hover,.ctx button:focus-visible{background:color-mix(in srgb,var(--accent) 12%,var(--sheet));outline:none}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--sheet);padding:9px 16px;border-radius:999px;font-size:14px;z-index:60;max-width:calc(100% - 32px);display:flex;gap:12px;align-items:center}
.toast button{background:transparent;border:0;color:var(--hi);font-weight:700;padding:0}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div>
      <div class="brand">段取り帳</div>
      <nav class="datenav" aria-label="日付">
        <button class="iconbtn" id="prevDay" aria-label="前の日">‹</button>
        <h1><span id="dMd">—</span><span class="wd" id="dWd">—</span></h1>
        <button class="iconbtn" id="nextDay" aria-label="次の日">›</button>
        <button class="pill" id="todayBtn">今日へ</button>
      </nav>
    </div>

<script>
/* Google Cloud で作った OAuth クライアントID（ウェブアプリ）。設定欄で入れた値があればそちらが優先 */
const GOOGLE_CLIENT_ID='';
const SCOPES='https://www.googleapis.com/auth/calendar.readonly openid email profile';

const $=s=>document.querySelector(s);
const CATS={class:{label:'授業・実習',work:true},study:{label:'勉強',work:true},work:{label:'作業',work:true},hobby:{label:'趣味',work:false},life:{label:'生活',work:false},move:{label:'移動',work:false}};
const PRIO={1:'高',2:'中',3:'低'};
const KEY='dandori:v1',TKEY='dandori:gtoken';
const DEF={dayStart:420,dayEnd:1440,buffer:5,snap:5,breakEvery:90,breakLen:10,fromNow:true,autoReplan:true,notify:false};
const MIN_CHUNK=30,PPM=1.4;
const PIN='<svg class="pin" viewBox="0 0 16 16" aria-label="手で配置"><path fill="currentColor" d="M10.6 1.3 14.7 5.4l-1.2 1.2-.9-.3-2.6 2.6.2 2.8-1.2 1.2-2.6-2.6-3.3 3.3-.9-.9L5.5 9.4 2.9 6.8l1.2-1.2 2.8.2 2.6-2.6-.3-.9z"/></svg>';
const GLOGO='<svg class="gmark" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.6 5.4 2.7 13.3l7.9 6.1C12.5 13.6 17.8 9.5 24 9.5z"/><path fill="#4285F4" d="M46.1 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.4c-.5 2.9-2.2 5.3-4.6 7l7.5 5.8c4.4-4 6.8-10 6.8-17.3z"/><path fill="#FBBC05" d="M10.5 28.6c-.5-1.4-.8-3-.8-4.6s.3-3.2.8-4.6l-7.9-6.1C1 16.6 0 20.2 0 24s1 7.4 2.7 10.7l7.8-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.5-5.8c-2.1 1.4-4.9 2.3-8.4 2.3-6.2 0-11.5-4.1-13.4-9.8l-7.9 6.1C6.6 42.6 14.6 48 24 48z"/></svg>';

const pad=n=>String(n).padStart(2,'0');
const fmt=m=>{m=Math.round(m);return pad(Math.floor(m/60))+':'+pad(((m%60)+60)%60)};
const durL=m=>{m=Math.round(m);if(m<60)return m+'分';const h=Math.floor(m/60),r=m%60;return h+'時間'+(r?r+'分':'')};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,10);
const dStr=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const todayStr=()=>dStr(new Date());
const shift=(s,n)=>{const[y,m,d]=s.split('-').map(Number);return dStr(new Date(y,m-1,d+n))};
const WD='日月火水木金土';
const dInfo=s=>{const[y,m,d]=s.split('-').map(Number);const w=new Date(y,m-1,d).getDay();return{md:`${m}月${d}日`,wd:WD[w],w,d}};
const nowMin=()=>{const n=new Date();return n.getHours()*60+n.getMinutes()};
const snapUp=m=>Math.ceil(m/5)*5;
function parseT(v){if(!v)return null;const[h,m]=v.split(':').map(Number);let t=h*60+(m||0);if(S().dayEnd>1440&&t<S().dayStart-60)t+=1440;return t}

/* ---------- データ ---------- */
let DB=null;
function normalize(o){
  o=o||{};o.v=2;o.settings={...DEF,...(o.settings||{})};o.days=o.days||{};o.routines=o.routines||[];o.inbox=o.inbox||[];
  o.gcal={clientId:'',calendars:[],selected:{},ignore:{},email:null,name:null,...(o.gcal||{})};
  return o;
}
function load(){try{const s=localStorage.getItem(KEY);if(s){const o=JSON.parse(s);if(o&&o.days)return normalize(o)}}catch(e){}return null}
function save(){try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){}}
let curDate=todayStr();
const S=()=>DB.settings;
function day(){return DB.days[curDate]||(DB.days[curDate]={tasks:[],places:[]})}
const taskOf=(d,id)=>id?d.tasks.find(t=>t.id===id):undefined;

/* ---------- 元に戻す ---------- */
const undoStack=[];
function snap(){undoStack.push(JSON.stringify(DB));if(undoStack.length>40)undoStack.shift();$('#undoBtn').disabled=false}
function undo(){const s=undoStack.pop();if(!s)return;DB=normalize(JSON.parse(s));save();$('#undoBtn').disabled=!undoStack.length;renderSettings();render();toast('元に戻しました')}
function mutate(fn,opt={}){snap();fn(day());if(opt.replan!==false&&S().autoReplan)autoPlan(day());save();render();if(opt.msg)toast(opt.msg,true)}

/* ---------- Googleカレンダー ---------- */
const GC={token:null,exp:0,cache:{},status:'',bad:false,loading:false,client:null};
try{const t=JSON.parse(localStorage.getItem(TKEY)||'null');if(t&&t.exp>Date.now()){GC.token=t.token;GC.exp=t.exp}}catch(e){}
const clientId=()=>(DB.gcal.clientId||GOOGLE_CLIENT_ID||'').trim();
const gLive=()=>!!GC.token&&GC.exp>Date.now();
function gDrop(){GC.token=null;GC.exp=0;try{localStorage.removeItem(TKEY)}catch(e){}}
function gInitClient(){
  if(GC.client)return true;
  if(!(window.google&&google.accounts&&google.accounts.oauth2)||!clientId())return false;
  GC.client=google.accounts.oauth2.initTokenClient({client_id:clientId(),scope:SCOPES,callback:onToken,
    error_callback:e=>{GC.status=e&&e.type==='popup_closed'?'ログインの画面が閉じられました。':'ログインを開始できませんでした。ポップアップがブロックされていないか確認してください。';GC.bad=true;renderGoogle()}});
  return true;
}
function gLogin(){
  if(!clientId()){toast('先に「組み方の設定」でクライアントIDを入れてください');return}
  if(!gInitClient()){toast('Googleの読み込みを待っています。数秒後にもう一度押してください');return}
  const o={prompt:DB.gcal.email?'':'consent'};if(DB.gcal.email)o.login_hint=DB.gcal.email;
  GC.client.requestAccessToken(o);
}
async function onToken(r){
  if(!r||r.error){GC.status='ログインできませんでした（'+esc(r&&(r.error_description||r.error)||'不明なエラー')+'）。';GC.bad=true;renderGoogle();return}
  if(!google.accounts.oauth2.hasGrantedAnyScope(r,'https://www.googleapis.com/auth/calendar.readonly')){GC.status='カレンダーの閲覧が許可されませんでした。もう一度ログインし、カレンダーへのアクセスにチェックを入れてください。';GC.bad=true;renderGoogle();return}
  GC.token=r.access_token;GC.exp=Date.now()+(+r.expires_in||3600)*1000-60000;
  try{localStorage.setItem(TKEY,JSON.stringify({token:GC.token,exp:GC.exp}))}catch(e){}
  GC.bad=false;GC.status='';
  try{
    const u=await gApi('https://www.googleapis.com/oauth2/v3/userinfo');
    DB.gcal.email=u.email||null;DB.gcal.name=u.name||u.email||'Googleアカウント';
    await gLoadCalendars();
    GC.cache={};await gSync(true);
  }catch(e){gErr(e)}
}
async function gLoadCalendars(){
  const cl=await gApi('https://www.googleapis.com/calendar/v3/users/me/calendarList?minAccessRole=reader&maxResults=250');
  const items=cl.items||[];
  DB.gcal.calendars=items.map(c=>({id:c.id,summary:c.summaryOverride||c.summary||c.id,color:c.backgroundColor||'#4a6cf7',primary:!!c.primary}));
  for(const c of items)if(DB.gcal.selected[c.id]===undefined)DB.gcal.selected[c.id]=!!(c.primary||c.selected);
  save();
}
async function gApi(url){
  const r=await fetch(url,{headers:{Authorization:'Bearer '+GC.token}});
  if(r.status===401){gDrop();throw new Error('auth')}
  if(!r.ok){let m='';try{m=(await r.json()).error.message}catch(e){}throw new Error('http '+r.status+(m?' '+m:''))}
  return r.json();
}
function gErr(e){
  GC.loading=false;GC.bad=true;
  GC.status=e.message==='auth'?'接続の期限が切れました。「再接続」を押してください。':
    /403/.test(e.message)?'Googleカレンダーを読み込めませんでした。Google CloudでCalendar APIが有効か確認してください。':'Googleカレンダーを読み込めませんでした（'+esc(e.message)+'）。';
  renderGoogle();
}
function gLogout(){
  if(GC.token&&window.google&&google.accounts&&google.accounts.oauth2){try{google.accounts.oauth2.revoke(GC.token,()=>{})}catch(e){}}
  gDrop();GC.cache={};GC.status='';GC.bad=false;DB.gcal.email=null;DB.gcal.name=null;save();
  if(S().autoReplan)autoPlan(day());save();render();toast('Googleからログアウトしました');
}
function evNorm(ev,c,t0){
  const id=c.id+'|'+ev.id,base={id,calId:c.id,calName:c.summary,color:ev.colorId?c.color:c.color,title:ev.summary||'（タイトルなし）',location:ev.location||'',desc:(ev.description||'').replace(/<[^>]+>/g,' ').slice(0,400),link:ev.htmlLink||''};
  if(ev.start&&ev.start.date)return{...base,allDay:true};
  const s=(new Date(ev.start.dateTime)-t0)/60000,e=(new Date(ev.end.dateTime)-t0)/60000;
  const st=Math.max(0,s);return{...base,allDay:false,start:st,dur:Math.max(0,e-st),rawStart:s,rawEnd:e};
}
async function gFetchDay(date,force){
  if(!gLive())return false;
  const c=GC.cache[date];if(c&&!force&&Date.now()-c.at<5*60000)return false;
  const[y,m,d]=date.split('-').map(Number);
  const t0=new Date(y,m-1,d,0,0),t1=new Date(y,m-1,d,0,Math.max(S().dayEnd,1440));
  const cals=DB.gcal.calendars.filter(x=>DB.gcal.selected[x.id]);
  const all=[];
  await Promise.all(cals.map(async cal=>{
    const q=new URLSearchParams({timeMin:t0.toISOString(),timeMax:t1.toISOString(),singleEvents:'true',orderBy:'startTime',maxResults:'250'});
    const r=await gApi(`https://www.googleapis.com/calendar/v3/calendars/${encodeURIComponent(cal.id)}/events?${q}`);
    for(const ev of r.items||[]){
      if(ev.status==='cancelled')continue;
      const me=(ev.attendees||[]).find(a=>a.self);if(me&&me.responseStatus==='declined')continue;
      all.push(evNorm(ev,cal,t0));
    }
  }));
  GC.cache[date]={at:Date.now(),events:all};
  return true;
}
async function gSync(force){
  if(!gLive()){renderGoogle();return}
  GC.loading=true;renderGoogle();
  const date=curDate;
  try{
    await gFetchDay(date,force);GC.loading=false;GC.bad=false;
    if(date===curDate){if(S().autoReplan)autoPlan(day());save();render()}
  }catch(e){gErr(e)}
}
function gEvents(date){const c=GC.cache[date];if(!c)return[];return c.events.filter(e=>DB.gcal.selected[e.calId])}
function gIgnored(date){return new Set(DB.gcal.ignore[date]||[])}
function gBlocks(){
  const ign=gIgnored(curDate);
  return gEvents(curDate).filter(e=>!e.allDay&&e.dur>0&&!ign.has(e.id)).map(e=>({id:'g_'+e.id,gid:e.id,taskId:null,gcal:e,start:e.start,dur:e.dur,fixed:true,pinned:true}));
}

/* ---------- ブロックと自動配置 ---------- */
function blocks(d){
  const out=[];
  for(const t of d.tasks)if(t.fixed!=null)out.push({id:'f_'+t.id,taskId:t.id,start:t.fixed,dur:t.dur,fixed:true,pinned:true});
  for(const p of d.places)out.push(p);
  if(d===DB.days[curDate])out.push(...gBlocks());
  return out.sort((a,b)=>a.start-b.start||b.dur-a.dur);
}
function catOf(d,b){if(b.gcal)return'gcal';if(b.taskId==='__break')return'rest';const t=taskOf(d,b.taskId);return t?t.cat:'move'}
const isWork=(d,b)=>b.gcal?true:b.taskId!=='__break'&&!!(CATS[catOf(d,b)]||{}).work;
const nameOf=(d,b)=>b.gcal?b.gcal.title:b.taskId==='__break'?'休憩':((taskOf(d,b.taskId)||{}).title||'');
function runBefore(d,occ,s){
  let t=s,run=0,g=0;
  while(g++<50){
    let best=null;
    for(const b of occ){const e=b.start+b.dur;if(e<=t&&t-e<=S().buffer+5&&(!best||e>best.start+best.dur))best=b}
    if(!best||!isWork(d,best))break;
    run+=best.dur;t=best.start;
  }
  return run;
}
function freeGaps(occ){
  const gaps=[];let cur=S().dayStart;
  for(const o of occ){const gEnd=o.start-S().buffer;if(gEnd-cur>0)gaps.push([cur,gEnd]);cur=Math.max(cur,o.start+o.dur+S().buffer)}
  if(S().dayEnd-cur>0)gaps.push([cur,S().dayEnd]);
  return gaps;
}
function placeTask(d,t,rem,occ,minStart){
  const work=!!(CATS[t.cat]||{}).work,be=S().breakEvery>0?S().breakEvery:Infinity;let guard=0;
  while(rem>0&&guard++<40){
    const gaps=freeGaps(occ).map(([a,b])=>[Math.max(a,minStart),b]).filter(([a,b])=>b-a>0);
    let ok=false;
    for(const[g0,g1]of gaps){
      let s=snapUp(g0);
      const run=work?runBefore(d,occ,s):0;
      let room=work?be-run:Infinity;
      const need=work&&run>0&&be!==Infinity&&(t.split?room<Math.min(MIN_CHUNK,rem):run+rem>be);
      let bS=null;
      if(need){bS=s;s=snapUp(s+S().breakLen+S().buffer);room=be}
      const avail=g1-s;let len;
      if(t.split){len=Math.min(rem,avail,room);if(len<rem)len=Math.floor(len/5)*5;if(len<Math.min(MIN_CHUNK,rem))continue}
      else{if(avail<rem)continue;len=rem}
      if(bS!==null){const br={id:uid(),taskId:'__break',start:bS,dur:S().breakLen,pinned:false};d.places.push(br);occ.push(br)}
      const p={id:uid(),taskId:t.id,start:s,dur:len,pinned:false};d.places.push(p);occ.push(p);
      occ.sort((a,b)=>a.start-b.start);rem-=len;ok=true;break;
    }
    if(!ok)break;
  }
  return rem;
}
function autoPlan(d){
  d.places=d.places.filter(p=>{if(p.taskId==='__break')return p.pinned;const t=taskOf(d,p.taskId);return t&&t.fixed==null&&(p.pinned||t.done)});
  const minStart=(curDate===todayStr()&&S().fromNow)?snapUp(nowMin()):-Infinity;
  const occ=blocks(d);
  const flex=d.tasks.map((t,i)=>({t,i})).filter(x=>x.t.fixed==null&&!x.t.done).sort((a,b)=>a.t.prio-b.t.prio||a.i-b.i);
  for(const{t}of flex){
    const have=d.places.filter(p=>p.taskId===t.id).reduce((s,p)=>s+p.dur,0);

function covered(bl,a,b){
  const iv=bl.map(x=>[Math.max(a,x.start),Math.min(b,x.start+x.dur)]).filter(([s,e])=>e>s).sort((p,q)=>p[0]-q[0]);
  let tot=0,cs=0,ce=-Infinity;
  for(const[s,e]of iv){if(s>ce){if(ce>cs)tot+=ce-cs;cs=s;ce=e}else ce=Math.max(ce,e)}
  if(ce>cs)tot+=ce-cs;return tot;
}

function layoutCols(bl){
  const items=bl.map(b=>({b,s:b.start,e:b.start+b.dur,col:0,n:1}));
  let cluster=[],cEnd=-Infinity,ends=[];
  const flush=()=>{const n=ends.length;cluster.forEach(it=>it.n=n);cluster=[];ends=[]};
  for(const it of items){
    if(cluster.length&&it.s>=cEnd)flush();
    let c=ends.findIndex(e=>e<=it.s);
    if(c<0){c=ends.length;ends.push(it.e)}else ends[c]=it.e;
    it.col=c;cluster.push(it);cEnd=Math.max(cluster.length===1?-Infinity:cEnd,it.e);
  }
  flush();return items;
}

  const sn=S().snap,dm=Math.round(dy/PPM/sn)*sn;

  const tm=drag.el.querySelector('.tm');

});

function endDrag(commit){
  if(!drag)return;clearTimeout(drag.timer);const g=drag;drag=null;

  if(commit&&g.moved){
    mutate(d=>{
      const b=g.b,t=taskOf(d,b.taskId);
      if(g.mode==='move'){const ns=b.start+g.dm;if(b.fixed)t.fixed=ns;else{const p=d.places.find(x=>x.id===b.id);p.start=ns;p.pinned=true}}
      else{const nd=Math.max(5,b.dur+g.dm);if(b.fixed)t.dur=nd;else{const p=d.places.find(x=>x.id===b.id);if(t)t.dur=Math.max(5,t.dur+(nd-p.dur));p.dur=nd;p.pinned=true}}
    });

}

$('#rDays').innerHTML=[1,2,3,4,5,6,0].map(w=>`<label><input type="checkbox" value="${w}"${w>=1&&w<=5?' checked':''}><span class="${w===0?'sun':w===6?'sat':''}">${WD[w]}</span></label>`).join('');
function syncChips(){const v=+$('#tDur').value;document.querySelectorAll('#durChips .chip').forEach(c=>c.setAttribute('aria-pressed',+c.dataset.d===v))}
$('#durChips').addEventListener('click',e=>{const c=e.target.closest('.chip');if(!c)return;$('#tDur').value=c.dataset.d;syncChips()});
$('#tDur').addEventListener('input',syncChips);syncChips();
$('#tFixOn').addEventListener('change',e=>{$('#tFix').disabled=!e.target.checked});
function readForm(){
  const err=$('#addErr'),title=$('#tTitle').value.trim(),dur=parseInt($('#tDur').value,10);
  if(!title){err.textContent='タイトルを入れてください。';err.hidden=false;$('#tTitle').focus();return null}
  if(!(dur>=5)){err.textContent='所要時間は5分以上で入れてください。';err.hidden=false;$('#tDur').focus();return null}
  err.hidden=true;
  return{id:uid(),title,dur,cat:$('#tCat').value,prio:+document.querySelector('input[name=prio]:checked').value,fixed:$('#tFixOn').checked?parseT($('#tFix').value):null,split:$('#tSplit').checked,done:false};
}
function resetForm(){$('#tTitle').value='';$('#tFixOn').checked=false;$('#tFix').disabled=true;$('#tSplit').checked=false}
$('#addForm').addEventListener('submit',e=>{
  e.preventDefault();const t=readForm();if(!t)return;
  mutate(d=>d.tasks.push(t));resetForm();
  toast(remOf(day(),t)?`「${t.title}」は空きに入りきりませんでした`:`「${t.title}」を追加しました`,true);
});
$('#addInbox').addEventListener('click',()=>{
  const t=readForm();if(!t)return;t.fixed=null;
  mutate(()=>DB.inbox.push(t),{replan:false,msg:`「${t.title}」をあとでやるに入れました`});resetForm();
});

/* ---------- リストの操作 ---------- */
$('#taskList').addEventListener('click',e=>{
  const row=e.target.closest('.trow');if(!row)return;const d=day(),t=taskOf(d,row.dataset.id);if(!t)return;
  if(e.target.closest('[data-act=done]')){mutate(d=>{t.done=!t.done;if(t.done)d.places.forEach(p=>{if(p.taskId===t.id)p.pinned=true})});return}
  openEditor(t.id);
});
$('#inboxList').addEventListener('click',e=>{
  const row=e.target.closest('.irow');if(!row)return;const i=DB.inbox.findIndex(x=>x.id===row.dataset.id);if(i<0)return;const t=DB.inbox[i];
  const act=e.target.closest('[data-act]');if(!act)return;
  if(act.dataset.act==='take')mutate(d=>{DB.inbox.splice(i,1);d.tasks.push({...t,id:uid(),fixed:null,done:false})},{msg:`「${t.title}」をこの日に入れました`});
  if(act.dataset.act==='del')mutate(()=>DB.inbox.splice(i,1),{replan:false,msg:`「${t.title}」を消しました`});
});
$('#undoBtn').addEventListener('click',undo);
document.addEventListener('keydown',e=>{
  if((e.metaKey||e.ctrlKey)&&!e.shiftKey&&e.key.toLowerCase()==='z'&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)&&ov.hidden){e.preventDefault();undo()}
});
$('#planBtn').addEventListener('click',()=>mutate(d=>autoPlan(d),{replan:false,msg:'空き時間に組み直しました'}));
$('#unpinBtn').addEventListener('click',()=>mutate(d=>{d.places.forEach(p=>{const t=taskOf(d,p.taskId);if(!t||!t.done)p.pinned=false});autoPlan(d)},{replan:false,msg:'自動の配置に戻しました'}));
$('#carryArea').addEventListener('click',e=>{
  if(e.target.id==='carryBtn'){const prev=DB.days[shift(curDate,-1)];
    mutate(d=>{const left=prev.tasks.filter(t=>!t.done&&t.fixed==null&&!t.sample&&!t.routineId&&!d.tasks.some(x=>x.from===t.id));left.forEach(t=>d.tasks.push({...t,id:uid(),from:t.id,done:false}))},{msg:'前日の残りを持ち越しました'})}
  if(e.target.id==='weekBtn'){const src=DB.days[e.target.dataset.src];
    mutate(d=>src.tasks.filter(t=>t.fixed!=null&&!t.routineId).forEach(t=>d.tasks.push({...t,id:uid(),done:false,sample:false})),{msg:'時刻つきの予定を写しました'})}
});
$('#copyBtn').addEventListener('click',()=>{
  const d=day(),i=dInfo(curDate),lines=[`${i.md}（${i.wd}）`];
  for(const e of gEvents(curDate).filter(e=>e.allDay))lines.push(`終日 ${e.title}`);
  for(const b of blocks(d)){const t=taskOf(d,b.taskId);lines.push(`${fmt(b.start)}–${fmt(b.start+b.dur)} ${nameOf(d,b)}${t&&t.done?' ✓':''}`)}
  const miss=d.tasks.filter(t=>remOf(d,t)>0);
  if(miss.length)lines.push('','入りきらない: '+miss.map(t=>`${t.title}（${durL(remOf(d,t))}）`).join('、'));
  copyText(lines.join('\n'));
});
$('#clearSample').addEventListener('click',()=>mutate(d=>{const ids=new Set(d.tasks.filter(t=>t.sample).map(t=>t.id));d.tasks=d.tasks.filter(t=>!t.sample);d.places=d.places.filter(p=>!ids.has(p.taskId)&&p.taskId!=='__break')}));
function goDate(s){curDate=s;firstPaint=true;render();if(gLive())gSync(false)}
$('#prevDay').addEventListener('click',()=>goDate(shift(curDate,-1)));
$('#nextDay').addEventListener('click',()=>goDate(shift(curDate,1)));
$('#todayBtn').addEventListener('click',()=>goDate(todayStr()));
$('#week').addEventListener('click',e=>{const b=e.target.closest('.wk');if(b)goDate(b.dataset.date)});
$('#nowCard').addEventListener('click',e=>{
  const a=e.target.closest('[data-act]');if(!a)return;
  if(a.dataset.act==='ndone')mutate(d=>{const t=taskOf(d,a.dataset.tid);if(t){t.done=true;d.places.forEach(p=>{if(p.taskId===t.id)p.pinned=true})}},{msg:'完了にしました'});
  if(a.dataset.act==='extend')mutate(d=>{
    const b=findBlock(d,a.dataset.bid);if(!b)return;const t=taskOf(d,b.taskId);
    if(b.fixed){t.dur+=15}else{const p=d.places.find(x=>x.id===b.id);p.dur+=15;p.pinned=true;if(t)t.dur+=15}
  },{msg:'15分のばして、後ろの予定を組み直しました'});
});

/* ---------- シート ---------- */
const ov=$('#overlay'),sh=$('#sheet');
function closeSheet(){ov.hidden=true;sh.innerHTML=''}
ov.addEventListener('click',e=>{if(e.target===ov)closeSheet()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!ov.hidden)closeSheet()});
function editStart(d,t){if(t.fixed!=null)return t.fixed;const f=firstStart(d,t);return f===Infinity?540:f}
function openEditor(id){
  const d=day(),t=taskOf(d,id);if(!t)return;
  const pinned=d.places.some(p=>p.taskId===id&&p.pinned);
  sh.innerHTML=`<h2>予定を編集</h2>
   <label class="field"><span>タイトル</span><input type="text" id="eTitle" value="${esc(t.title)}"></label>
   <div class="row"><label class="field"><span>所要時間（分）</span><input type="number" id="eDur" min="5" step="5" value="${t.dur}"></label>
   <label class="field"><span>分類</span><select id="eCat">${catOpts(t.cat)}</select></label></div>
   <div class="field"><span>優先度</span><div class="seg">${[1,2,3].map(p=>`<label><input type="radio" name="eprio" value="${p}"${t.prio===p?' checked':''}><span>${PRIO[p]}</span></label>`).join('')}</div></div>
   <div class="timepick"><label class="check"><input type="checkbox" id="eFixOn"${t.fixed!=null?' checked':''}> 開始時刻を決める</label><input type="time" id="eFix" step="300" value="${fmt(editStart(d,t)%1440)}"${t.fixed==null?' disabled':''}></div>
   <label class="check"><input type="checkbox" id="eSplit"${t.split?' checked':''}> 何回かに分けてもいい</label>
   <label class="check"><input type="checkbox" id="eDone"${t.done?' checked':''}> 完了した</label>
   <div class="sheet-actions"><button class="danger" id="eDel">削除</button><button class="ghost" id="eInbox">あとでやるへ移す</button><span class="sp"></span>
    ${pinned?'<button class="ghost" id="eUnpin">手での配置をやめる</button>':''}
    <button class="ghost" id="eCancel">閉じる</button><button class="primary" id="eSave">保存</button></div>`;
  ov.hidden=false;
  $('#eFixOn').addEventListener('change',e=>{$('#eFix').disabled=!e.target.checked});
  $('#eCancel').onclick=closeSheet;
  $('#eDel').onclick=()=>{closeSheet();mutate(d=>{d.tasks=d.tasks.filter(x=>x.id!==id);d.places=d.places.filter(p=>p.taskId!==id)},{msg:`「${t.title}」を削除しました`})};
  $('#eInbox').onclick=()=>{closeSheet();mutate(d=>{d.tasks=d.tasks.filter(x=>x.id!==id);d.places=d.places.filter(p=>p.taskId!==id);DB.inbox.push({id:uid(),title:t.title,dur:t.dur,cat:t.cat,prio:t.prio,split:t.split,fixed:null,done:false})},{msg:`「${t.title}」をあとでやるへ移しました`})};
  if(pinned)$('#eUnpin').onclick=()=>{closeSheet();mutate(d=>d.places.forEach(p=>{if(p.taskId===id)p.pinned=false}))};
  $('#eSave').onclick=()=>{
    const title=$('#eTitle').value.trim(),dur=parseInt($('#eDur').value,10);
    if(!title||!(dur>=5)){toast('タイトルと5分以上の所要時間を入れてください');return}
    const fixOn=$('#eFixOn').checked,fixV=$('#eFix').value,cat=$('#eCat').value,prio=+sh.querySelector('input[name=eprio]:checked').value,split=$('#eSplit').checked,nd=$('#eDone').checked;
    closeSheet();
    mutate(d=>{
      const wasFixed=t.fixed!=null;
      t.title=title;t.cat=cat;t.prio=prio;t.split=split;
      if(dur!==t.dur){t.dur=dur;d.places=d.places.filter(p=>p.taskId!==id)}
      t.fixed=fixOn?parseT(fixV):null;
      if(fixOn||wasFixed)d.places=d.places.filter(p=>p.taskId!==id);
      if(nd&&!t.done)d.places.forEach(p=>{if(p.taskId===id)p.pinned=true});t.done=nd;
    });
  };
  setTimeout(()=>$('#eTitle').focus(),30);
}
function openBreak(pid){
  const d=day(),p=d.places.find(x=>x.id===pid);if(!p)return;
  sh.innerHTML=`<h2>休憩 ${fmt(p.start)}–${fmt(p.start+p.dur)}</h2>
   <p class="hint">休憩は作業が続いたときに自動で入ります。間隔と長さは「組み方の設定」で変えられます。</p>
   <div class="sheet-actions"><span class="sp"></span>${p.pinned?'<button class="ghost" id="bUnpin">自動の位置に戻す</button>':''}<button class="primary" id="bClose">閉じる</button></div>`;
  ov.hidden=false;$('#bClose').onclick=closeSheet;
  if(p.pinned)$('#bUnpin').onclick=()=>{closeSheet();mutate(()=>{p.pinned=false})};
}
function openEvent(gid){
  const e=gEvents(curDate).find(x=>x.id===gid);if(!e)return;
  const ign=gIgnored(curDate).has(gid);
  sh.innerHTML=`<h2>${esc(e.title)}</h2>
   <div class="tmeta" style="font-size:14px"><span class="mono">${e.allDay?'終日':fmt(e.rawStart)+'–'+fmt(e.rawEnd)}</span><span style="display:inline-flex;align-items:center;gap:6px"><i class="dot" style="background:${esc(e.color)}"></i>${esc(e.calName)}</span></div>
   ${e.location?`<p class="hint">場所: ${esc(e.location)}</p>`:''}
   ${e.desc.trim()?`<p class="desc">${esc(e.desc.trim())}</p>`:''}
   <p class="hint">Googleカレンダーの予定はここでは変更できません。段取りはこの予定を避けて組まれます。</p>
   <div class="sheet-actions">${e.link?`<a class="ghost" href="${esc(e.link)}" target="_blank" rel="noopener" style="text-decoration:none">Googleカレンダーで開く</a>`:''}<span class="sp"></span>
    ${e.allDay?'':`<button class="ghost" id="evIgn">${ign?'配置で考えるようにする':'配置では無視する'}</button>`}<button class="primary" id="evClose">閉じる</button></div>`;
  ov.hidden=false;$('#evClose').onclick=closeSheet;
  if(!e.allDay)$('#evIgn').onclick=()=>{closeSheet();mutate(()=>{const L=DB.gcal.ignore[curDate]=DB.gcal.ignore[curDate]||[];const i=L.indexOf(gid);if(i>=0)L.splice(i,1);else L.push(gid)},{msg:ign?'この予定を避けて組み直しました':'この予定を無視して組み直しました'})};
}

/* ---------- 右クリックメニュー（編集・複製） ---------- */
const ctx=$('#ctx');let ctxTarget=null;
function closeCtx(){ctx.hidden=true;ctxTarget=null}
function openCtx(x,y,b){
  const d=day();ctxTarget=b;
  const editLabel=b.gcal?'詳細を見る':'編集';
  const canDup=b.taskId!=='__break';
  ctx.innerHTML=`<div class="ctit">${esc(nameOf(d,b))}</div><button role="menuitem" data-c="edit">${editLabel}</button>${canDup?'<button role="menuitem" data-c="dup">複製</button>':''}`;
  ctx.hidden=false;
  const r=ctx.getBoundingClientRect();
  ctx.style.left=Math.max(8,Math.min(x,innerWidth-r.width-8))+'px';
  ctx.style.top=Math.max(8,Math.min(y,innerHeight-r.height-8))+'px';
  ctx.querySelector('button').focus({preventScroll:true});
}
function dupBlock(b){
  const d=day();
  if(b.gcal){
    const e=b.gcal;
    mutate(d=>d.tasks.push({id:uid(),title:e.title,cat:'work',dur:Math.max(5,Math.round(e.dur/5)*5),prio:2,fixed:snapUp(e.start+e.dur+S().buffer),split:false,done:false}),{msg:`「${e.title}」を自分の予定として複製しました`});
    return;
  }
  const t=taskOf(d,b.taskId);if(!t)return;
  const copy={...t,id:uid(),done:false};delete copy.sample;delete copy.routineId;delete copy.from;
  if(t.fixed!=null)copy.fixed=snapUp(t.fixed+t.dur+S().buffer);
  mutate(d=>d.tasks.push(copy),{msg:`「${t.title}」を複製しました`});
}
ctx.addEventListener('click',e=>{
  const c=e.target.closest('[data-c]');if(!c||!ctxTarget)return;const b=ctxTarget;closeCtx();
  if(c.dataset.c==='edit')openBlock(b);else dupBlock(b);
});
ctx.addEventListener('keydown',e=>{
  if(e.key==='Escape'){closeCtx();return}
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();const bs=[...ctx.querySelectorAll('button')],i=bs.indexOf(document.activeElement);bs[(i+(e.key==='ArrowDown'?1:-1)+bs.length)%bs.length].focus()}
});
document.addEventListener('pointerdown',e=>{if(!ctx.hidden&&!e.target.closest('#ctx'))closeCtx()},true);
window.addEventListener('blur',closeCtx);
$('#tlWrap').addEventListener('scroll',closeCtx,{passive:true});
tlEl.addEventListener('contextmenu',e=>{
  const el=e.target.closest('.blk');if(!el)return;e.preventDefault();
  if(drag&&drag.moved)return;
  if(drag){clearTimeout(drag.timer);drag.el.classList.remove('lift');drag=null}
  const b=findBlock(day(),el.dataset.id);if(b)openCtx(e.clientX,e.clientY,b);
});
$('#taskList').addEventListener('contextmenu',e=>{
  const row=e.target.closest('.trow');if(!row)return;e.preventDefault();
  const d=day(),t=taskOf(d,row.dataset.id);if(!t)return;
  const b=t.fixed!=null?{id:'f_'+t.id,taskId:t.id,start:t.fixed,dur:t.dur,fixed:true}:{id:'t_'+t.id,taskId:t.id,start:firstStart(d,t),dur:t.dur};
  openCtx(e.clientX,e.clientY,b);
});

$('#rAdd').addEventListener('click',()=>{

$('#rList').addEventListener('click',e=>{const b=e.target.closest('[data-rdel]');if(!b)return;mutate(()=>{DB.routines=DB.routines.filter(r=>r.id!==b.dataset.rdel)},{replan:false,msg:'ルーティンを消しました（入っている予定はそのまま残ります）'})});

/* ---------- 設定 ---------- */
function opts(sel,list,val){$(sel).innerHTML=list.map(([v,l])=>`<option value="${v}"${v===val?' selected':''}>${l}</option>`).join('')}
function renderSettings(){
  const s=S(),hrs=(a,b)=>{const r=[];for(let m=a;m<=b;m+=30)r.push([m,fmt(m)]);return r};
  opts('#sStart',hrs(240,720),s.dayStart);opts('#sEnd',hrs(1080,1560),s.dayEnd);
  opts('#sBuf',[0,5,10,15].map(v=>[v,v?v+'分':'なし']),s.buffer);
  opts('#sSnap',[5,10,15,30].map(v=>[v,v+'分']),s.snap);
  opts('#sBrEvery',[[0,'入れない'],[50,'50分ごと'],[60,'60分ごと'],[90,'90分ごと'],[120,'120分ごと']],s.breakEvery);
  opts('#sBrLen',[5,10,15,20,30].map(v=>[v,v+'分']),s.breakLen);
  $('#sFromNow').checked=s.fromNow;$('#sAuto').checked=s.autoReplan;$('#sNotify').checked=s.notify;
  $('#sClient').value=DB.gcal.clientId||'';
}
[['#sStart','dayStart'],['#sEnd','dayEnd'],['#sBuf','buffer'],['#sSnap','snap'],['#sBrEvery','breakEvery'],['#sBrLen','breakLen']].forEach(([sel,k])=>$(sel).addEventListener('change',e=>mutate(()=>{S()[k]=+e.target.value})));
$('#sFromNow').addEventListener('change',e=>mutate(()=>{S().fromNow=e.target.checked}));
$('#sAuto').addEventListener('change',e=>{S().autoReplan=e.target.checked;save()});
$('#sNotify').addEventListener('change',async e=>{
  if(!e.target.checked){S().notify=false;save();return}
  if(!('Notification' in window)){e.target.checked=false;toast('このブラウザは通知に対応していません');return}
  let p=Notification.permission;if(p==='default'){try{p=await Notification.requestPermission()}catch(_){}}
  if(p!=='granted'){e.target.checked=false;S().notify=false;save();toast('通知が許可されていません。ブラウザのサイト設定で許可してください');return}
  S().notify=true;save();toast('予定の5分前に通知します');
});
$('#sClient').addEventListener('change',e=>{const v=e.target.value.trim();DB.gcal.clientId=v;GC.client=null;save();renderGoogle()});
$('#bkCopy').addEventListener('click',()=>copyText(JSON.stringify(DB)));
$('#bkRestore').addEventListener('click',e=>{
  const b=e.currentTarget;let o;
  try{o=JSON.parse($('#bkText').value);if(!o||typeof o.days!=='object')throw 0}catch(_){toast('貼り付けた内容を読み取れませんでした。「全データをコピー」で取った文字列をそのまま貼ってください');return}
  if(!b.classList.contains('armed')){b.classList.add('armed');b.textContent='もう一度押すと今のデータを上書きします';return}
  snap();DB=normalize(o);save();b.classList.remove('armed');b.textContent='貼り付けた内容で上書きする';$('#bkText').value='';
  renderSettings();firstPaint=true;render();toast('バックアップから戻しました',true);
});

/* ---------- 共通 ---------- */
let toastT;
function toast(msg,withUndo){
  const t=$('#toast');t.innerHTML=esc(msg)+(withUndo&&undoStack.length?'<button id="toastUndo">元に戻す</button>':'');t.hidden=false;
  const u=$('#toastUndo');if(u)u.onclick=()=>{t.hidden=true;undo()};
  clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,withUndo?4200:2600);
}
function copyText(txt){
  const fb=()=>{sh.innerHTML=`<h2>コピー用テキスト</h2><p class="hint">自動でコピーできなかったので、下の文字を選択してコピーしてください。</p><textarea id="cpT" rows="10" readonly>${esc(txt)}</textarea><div class="sheet-actions"><span class="sp"></span><button class="primary" id="cpC">閉じる</button></div>`;ov.hidden=false;const ta=$('#cpT');ta.focus();ta.select();$('#cpC').onclick=closeSheet};
  try{navigator.clipboard.writeText(txt).then(()=>toast('コピーしました'),fb)}catch(_){fb()}
}
const notified=new Set();
function notifyTick(){
  if(!S().notify||!('Notification' in window)||Notification.permission!=='granted'||curDate!==todayStr())return;
  const d=day(),n=nowMin();
  for(const b of blocks(d)){
    if(b.taskId==='__break'||(taskOf(d,b.taskId)||{}).done)continue;
    const lead=b.start-n,key=curDate+'|'+b.id+'|'+b.start;
    if(lead>0&&lead<=5&&!notified.has(key)){notified.add(key);try{new Notification(`${fmt(b.start)}から ${nameOf(d,b)}`,{body:`あと${lead}分で始まります（${durL(b.dur)}）`,tag:key})}catch(_){}}
  }
}

/* ---------- 起動 ---------- */
function makeSample(date){
  const d=DB.days[date]={tasks:[],places:[],routined:true};
  const fx=[['朝食・身支度','life',45,'07:00'],['移動（大学まで）','move',35,'08:15'],['講義','class',190,'09:00'],['昼食','life',50,'12:10'],['実習','class',190,'13:00'],['移動（帰宅）','move',35,'16:20'],['夕食','life',50,'19:00'],['入浴','life',40,'22:30']];
  const fl=[['講義ノートの復習','study',90,1,true],['実習レポートを書く','work',60,1,false],['メール・連絡の返信','work',15,2,false],['英会話の練習','study',30,2,false],['洗濯','life',20,3,false],['ゲーム制作（Unity）','hobby',60,3,true]];
  fx.forEach(([title,cat,dur,f])=>d.tasks.push({id:uid(),title,cat,dur,prio:2,fixed:parseT(f),split:false,done:false,sample:true}));
  fl.forEach(([title,cat,dur,prio,split])=>d.tasks.push({id:uid(),title,cat,dur,prio,fixed:null,split,done:false,sample:true}));
  autoPlan(d);
}
DB=load();
if(!DB){DB=normalize(null);makeSample(curDate);save()}
renderSettings();render();
if(gLive())gSync(true);
setInterval(()=>{
  if(curDate===todayStr()&&!drag&&ov.hidden){renderNow(day());renderTimeline(day())}
  notifyTick();
},30000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&gLive())gSync(false)});
</script>
